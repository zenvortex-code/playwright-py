[pytest]
addopts =
    --base-url=https://playwright.dev
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports
    --alluredir=allure-results
    --clean-alluredir
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
