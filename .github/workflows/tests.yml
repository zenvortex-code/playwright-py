name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Install Playwright browsers
      run: uv run playwright install --with-deps chromium

    - name: Run tests
      run: uv run pytest
      continue-on-error: true

    - name: Generate HTML report from traces
      if: always()
      run: |
        mkdir -p playwright-report
        # Create simple index.html
        cat > playwright-report/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head><title>Test Report</title></head>
        <body>
        <h1>Playwright Test Report</h1>
        <p>View trace files and recordings in the artifacts section of this workflow run.</p>
        <p>Download the test-artifacts.zip to view detailed traces locally using <code>npx playwright show-trace trace.zip</code></p>
        </body>
        </html>
        EOF
        ls -la reports/

    - name: Deploy HTML Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: playwright-report

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: reports/
        retention-days: 30
