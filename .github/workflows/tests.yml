name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Install Playwright browsers
      run: uv run playwright install --with-deps chromium

    - name: Run tests and generate HTML report
      run: |
        mkdir -p reports
        uv run pytest --html=reports/report.html --self-contained-html
      continue-on-error: true

    - name: Check if reports exist
      run: |
        ls -la reports/ || echo "Reports directory not found"
        test -f reports/report.html && echo "Report file exists" || echo "Report file missing"

    - name: Deploy HTML Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always() && hashFiles('reports/report.html') != ''
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: reports

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: reports/
        retention-days: 30
