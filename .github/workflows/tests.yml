name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Install Playwright browsers
      run: uv run playwright install --with-deps chromium

    - name: Run tests
      run: uv run pytest || true
      continue-on-error: true

    - name: Check report generation
      if: always()
      run: |
        if [ -f reports/index.html ]; then
          echo "✅ HTML report generated successfully"
          ls -lh reports/index.html
        else
          echo "❌ HTML report not found, creating placeholder"
          mkdir -p reports
          echo "<html><body><h1>Tests ran but report generation failed</h1></body></html>" > reports/index.html
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: reports

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-traces
        path: |
          reports/
          test-results/
        retention-days: 30
        if-no-files-found: ignore
